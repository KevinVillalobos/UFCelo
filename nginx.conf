# Per-IP throttle for the visit counter (POST /api/visits increments it).
limit_req_zone $binary_remote_addr zone=visits:10m rate=6r/m;

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # JS/CSS/HTML keep the same filename between deploys, so the browser must revalidate them.
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # /peleador/<slug>?id=<fighter_id> is rendered by fighter.html, which reads the URL itself.
    location ^~ /peleador/ {
        try_files /fighter.html =404;
    }

    # /comparar/<slug-a>-vs-<slug-b>?a=<id>&b=<id> is rendered by comparison.html, which reads the URL itself.
    location ^~ /comparar/ {
        try_files /comparison.html =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /api/visits {
        limit_req zone=visits burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/visits;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
