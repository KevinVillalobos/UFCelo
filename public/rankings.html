<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rankings — UFCelo.gg</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="container">
  <div class="page-header">
    <h1>ELO Rankings</h1>
    <p>Active fighters ranked by ELO with inactivity decay. [C] = current UFC champion, always shown at #1. "UFC" column = official UFC ranking (synced from ufc.com).</p>
  </div>

  <div class="form-row" style="align-items:center;">
    <div class="form-group" style="max-width:280px;">
      <label>Division</label>
      <select id="div-sel"></select>
    </div>
    <div class="form-group" style="max-width:380px;">
      <label>&nbsp;</label>
      <div class="toggle-row">
        <button class="toggle-btn active" id="btn-active">Active</button>
        <button class="toggle-btn"        id="btn-alltime">All-time peak</button>
        <button class="toggle-btn"        id="btn-ufc">UFC Top 15</button>
      </div>
    </div>
  </div>

  <div id="stats-row" class="metrics-row" style="display:none;"></div>
  <div id="table-wrap"></div>
</main>

<script src="/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  let mode = 'active';  // 'active' | 'alltime' | 'ufc'
  const alltime = () => mode === 'alltime';
  const divSel   = document.getElementById('div-sel');
  const btnAct   = document.getElementById('btn-active');
  const btnAll   = document.getElementById('btn-alltime');
  const btnUfc   = document.getElementById('btn-ufc');
  populateDivSelect(divSel);

  async function load() {
    const div = divSel.value;
    document.getElementById('table-wrap').innerHTML = '<div class="loading">Loading…</div>';
    try {
      if (mode === 'ufc') {
        const [data, divisionList, byId, everyone] = await Promise.all([
          apiFetch(`/ufc-rankings/${divSlug(div)}`),
          apiFetch(`/rankings/${divSlug(div)}`),
          allFighters(),
          apiFetch(`/rankings/${divSlug(div)}/alltime`).catch(() => []),   // ranked fighters who are inactive in our data
        ]);
        everyone.forEach(f => { if (!byId.has(f.fighter_id)) byId.set(f.fighter_id, f); });
        document.getElementById('stats-row').style.display = 'none';
        renderUfc(data, divisionList, byId);
        return;
      }
      const path = alltime() ? `/rankings/${divSlug(div)}/alltime` : `/rankings/${divSlug(div)}`;
      const data = await apiFetch(path);
      renderTable(data);
      renderStats(data);
    } catch(e) {
      document.getElementById('table-wrap').innerHTML = `<div class="alert-error">Failed to load rankings.</div>`;
    }
  }

  function renderStats(data) {
    const row = document.getElementById('stats-row');
    const elos = data.map(f => f.elo);
    if (elos.length < 2) { row.style.display = 'none'; return; }
    const mean = elos.reduce((a,b)=>a+b,0)/elos.length;
    const std  = Math.sqrt(elos.map(e=>(e-mean)**2).reduce((a,b)=>a+b,0)/elos.length);
    const spread = Math.max(...elos) - Math.min(...elos);
    row.style.display = 'flex';
    row.innerHTML = `
      <div class="metric"><div class="metric-label">Fighters</div><div class="metric-value">${data.length}</div></div>
      <div class="metric"><div class="metric-label">Mean ELO</div><div class="metric-value">${mean.toFixed(0)}</div></div>
      <div class="metric"><div class="metric-label">Std Dev</div><div class="metric-value">${std.toFixed(0)}</div></div>
      <div class="metric"><div class="metric-label">ELO Spread</div><div class="metric-value">${spread.toFixed(0)}</div></div>`;
  }

  // Every active fighter of every division by id (the official top 15 can include fighters we list elsewhere)
  let _byId = null;
  async function allFighters() {
    if (!_byId) {
      const lists = await Promise.allSettled(DIVISIONS.map(d => apiFetch(`/rankings/${divSlug(d)}`)));
      _byId = new Map();
      lists.forEach(r => { if (r.status === 'fulfilled') r.value.forEach(f => _byId.set(f.fighter_id, f)); });
    }
    return _byId;
  }

  // ELO, Peak ELO, Peak vs, Record, Fights, Last Fight: the same cells in the ELO table and the UFC view
  function detailCells(f) {
    if (!f) return '<td colspan="6" style="color:var(--muted);">Not in our fighter data</td>';
    return `<td style="color:var(--red-text);font-weight:700;">${f.elo.toFixed(1)}</td>
        <td>${f.peak_elo ? f.peak_elo.toFixed(1) : '—'}</td>
        <td style="color:var(--muted);font-size:0.8rem;">${f.peak_elo_opponent || '—'}</td>
        <td>${f.record || '—'}</td>
        <td style="color:var(--muted);">${f.fight_count ?? '—'}</td>
        <td style="color:var(--muted);font-size:0.8rem;">${f.last_fight_date || '—'}</td>`;
  }

  function renderTable(data) {
    const rows = data.map((f, i) => {
      const rank = alltime() ? (f.rank ?? i+1) : i+1;
      const ufcRank = f.ufc_rank === 0 ? 'C' : (f.ufc_rank ?? '—');
      const champ = f.is_champion ? champBadge() : '';
      const visitor = f.visitor_label ? ` <span style="color:var(--muted);font-size:0.75rem;">[${f.visitor_label}]</span>` : '';
      const streak = streakBadge(f.streak || 0);
      const rowCls = (i === 0 ? 'is-first ' : '') + (i < 5 ? 'is-top5 ' : '') + (i === 4 ? 'is-top5-last' : '');
      const rankCell = i === 0 ? `<span class="rank-pill">${rank}</span>` : rank;
      return `<tr class="${rowCls.trim()}">
        <td style="color:var(--muted);width:40px;">${rankCell}</td>
        <td style="width:40px;font-weight:700;">${ufcRank}</td>
        <td>${champ}${f.fighter_name}${visitor} ${streak}</td>
        ${detailCells(f)}
      </tr>`;
    }).join('');
    document.getElementById('table-wrap').innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>#</th><th title="Official UFC ranking">UFC</th><th>Fighter</th><th>ELO</th><th>Peak ELO</th>
            <th>Peak vs</th><th>Record</th><th>Fights</th><th>Last Fight</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function renderUfc(data, divisionList, byId) {
    const eloRank = new Map(divisionList.map((f, k) => [f.fighter_id, k + 1]));
    const entries = [data.champion, ...data.ranked];
    let missing = 0;
    const rows = entries.map((e, i) => {
      const f = e.fighter_id ? byId.get(e.fighter_id) : null;
      if (!f) missing++;
      const ours = eloRank.get(e.fighter_id);
      const rowCls = (i === 0 ? 'is-first is-top5 ' : '') + (i >= 1 && i <= 5 ? 'is-top5 ' : '') + (i === 5 ? 'is-top5-last' : '');
      const label = e.rank === 0 ? '<span class="rank-pill">C</span>' : e.rank;
      const champ = f && f.is_champion ? champBadge() : '';
      const streak = f ? streakBadge(f.streak || 0) : '';
      const inactive = f && f.active === false ? ' <span style="color:var(--muted);font-size:0.72rem;" title="No fight in the last 2 years">[inactive]</span>' : '';
      return `<tr class="${rowCls.trim()}">
        <td style="color:var(--muted);width:40px;">${label}</td>
        <td style="width:60px;font-weight:700;" title="Our ELO rank in this division">${ours ?? '—'}</td>
        <td>${champ}${f ? f.fighter_name : e.fighter_name}${inactive} ${streak}</td>
        ${detailCells(f)}
      </tr>`;
    }).join('');
    const upd = data.updated_at ? new Date(data.updated_at).toLocaleString() : '—';
    document.getElementById('table-wrap').innerHTML = `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th title="Official UFC ranking">UFC</th><th title="Our ELO rank in this division">ELO #</th><th>Fighter</th><th>ELO</th><th>Peak ELO</th>
            <th>Peak vs</th><th>Record</th><th>Fights</th><th>Last Fight</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p style="color:var(--muted);font-size:0.78rem;">Official UFC rankings (ufc.com) · updated ${upd}${missing ? ` · ${missing} fighter${missing > 1 ? 's' : ''} not in our data` : ''}</p>`;
  }

  function setMode(m) {
    mode = m;
    btnAct.classList.toggle('active', m === 'active');
    btnAll.classList.toggle('active', m === 'alltime');
    btnUfc.classList.toggle('active', m === 'ufc');
    load();
  }
  btnAct.addEventListener('click', () => setMode('active'));
  btnAll.addEventListener('click', () => setMode('alltime'));
  btnUfc.addEventListener('click', () => setMode('ufc'));
  divSel.addEventListener('change', load);
  await load();
});
</script>
</body>
</html>
