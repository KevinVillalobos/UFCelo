networks:
  elosys:

services:
  backend:
    build: .
    restart: unless-stopped
    networks:
      - elosys
    volumes:
      - ./data:/app/data
    environment:
      - KV_REST_API_URL=${KV_REST_API_URL:-}
      - KV_REST_API_TOKEN=${KV_REST_API_TOKEN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://ufcelo.gg,https://www.ufcelo.gg}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/visits')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    networks:
      - elosys
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
